name: publish
on:
  release:
    types: [created]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm exchanges the GitHub OIDC token for a short-lived publish token.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node v24
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      # npm stage publish needs npm 11.15.0 or later.
      - name: Update npm
        run: npm install -g npm@11 && npm --version
      - name: Install pnpm
        id: pnpm-install
        uses: pnpm/action-setup@v6
        with:
          version: '12.15.0'
          run_install: false
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Build
        run: pnpm run build
      # Staged: the version stays unpublished until a maintainer approves it on npmjs.com
      # or with `npm stage approve <stage-id>`.
      - name: Stage on npm
        run: npm stage publish
